services:
  db:
    image: mysql:8.2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./buoy_database/${MYSQL_DATABASE}.sql:/docker-entrypoint-initdb.d/${MYSQL_DATABASE}.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: python_loader:latest
    container_name: python_loader
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      STATION_ID: ${STATION_ID}
      YEAR: ${YEAR}
    command: bash -c "python python_files/ingestor/main.py \"${MYSQL_ROOT_PASSWORD}\" \"${MYSQL_DATABASE}\" \"${STATION_ID}\" \"${YEAR}\" &&
             streamlit run python_files/streamlit_UI/appUI.py --server.port=8501 --server.address=0.0.0.0"